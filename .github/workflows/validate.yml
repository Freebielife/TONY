name: Validate TONY observatory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_refresh_sources.py'
      - run: python3 -m unittest discover -s tests -p 'test_service_registry.py'
      - run: python3 -m unittest discover -s tests -p 'test_trade_history.py'
      - run: node --check web/app.js
      - run: node --test tests/*.test.cjs
      - run: python3 build.py
      - run: python3 verify.py
